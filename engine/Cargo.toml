[package]
name = "nfsim"
version = "0.1.0"
edition = "2021"
description = "Niagara Falls economy simulation engine (native and WebAssembly)"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3

[profile.test]
opt-level = 3
